<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="icon" href="/assets/logo.png"><link rel="stylesheet" href="/styles.css"><title>Request a website quote | Webadi</title><style>main{width:min(90%,38rem);margin:3rem auto}label{display:grid;gap:.35rem;margin:1rem 0}input,select,textarea,button{font:inherit;padding:.55rem}fieldset{border:0;padding:0}button{cursor:pointer}#slots button{display:block;margin:.65rem 0}</style></head><body><main><a href="/">Webadi home</a><h1 id="title">Tell us about your project</h1><p id="intro">Custom websites typically cost around $800.</p><form id="inquiry"><fieldset><label>Name<input name="name" required maxlength="120" autocomplete="name"></label><label>Email<input type="email" name="email" required maxlength="254" autocomplete="email"></label><label>Organization<input name="organization" required maxlength="160" autocomplete="organization"></label><label>Current website (optional)<input type="url" name="website" maxlength="500" autocomplete="url"></label><label>What should your website help people do?<textarea name="goal" required maxlength="2000"></textarea></label><label>Launch timing<select name="timing" required><option value="">Choose one</option><option>Within a month</option><option>1–3 months</option><option>3+ months</option><option>Flexible</option></select></label><button>Request a quote</button></fieldset></form><p id="status" role="status"></p><a id="book" hidden>Book a free consultation</a><div id="slots"></div><p>Prefer Instagram? <a href="https://www.instagram.com/webadi.bb/" rel="noreferrer">Message @webadi.bb</a>.</p></main><script type="module" src="/inquiry/inquiry.js"></script></body></html>
